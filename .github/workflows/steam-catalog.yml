name: Sync Steam Store catalog

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Steam AppID, or blank to sync the full catalog
        required: false
        type: string
  schedule:
    - cron: '41 2 * * *'

permissions:
  contents: write

concurrency:
  group: steam-store-catalog

jobs:
  sync:
    if: github.repository == 'kiyotec/AVerseHub'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          sparse-checkout: catalog
      - run: node --test catalog/steam-sync.test.mjs
      - name: Sync catalog
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          APP_ID: ${{ inputs.app_id }}
        run: |
          if [ -n "$APP_ID" ]; then
            node catalog/steam-sync.mjs "$APP_ID"
          elif [ -n "$STEAM_WEB_API_KEY" ]; then
            node catalog/steam-sync.mjs
          else
            echo '::notice::Set STEAM_WEB_API_KEY to enable full Steam Store sync. Individual AppIDs can be synced without a key.'
          fi
      - name: Commit catalog changes
        run: |
          if [ ! -f catalog/steam-apps.json ]; then exit 0; fi
          git add catalog/steam-apps.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Update Steam Store catalog"
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com pull --rebase origin main
          git push origin HEAD:main
